<!doctype html>
<html lang="zh-CN" data-theme="light">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>ArtiChat 0.3.1 - 侧栏图标动画 Demo</title>
		<script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.js"></script>
		<style>
			:root {
				color-scheme: light;
				--page: #f4f5f7;
				--sidebar: #ffffff;
				--surface: #ffffff;
				--surface-soft: #f8f9fb;
				--hover: #f2f3f5;
				--active: #eceef2;
				--line: #e7e9ed;
				--text: #25282e;
				--text-soft: #5e646e;
				--muted: #8b919b;
				--accent: #7759c7;
				--accent-soft: #f0ecfb;
				--shadow: 0 20px 55px rgb(24 29 38 / 9%), 0 2px 10px rgb(24 29 38 / 6%);
			}

			html[data-theme='dark'] {
				color-scheme: dark;
				--page: #161719;
				--sidebar: #1d1f22;
				--surface: #202226;
				--surface-soft: #26292e;
				--hover: #292c31;
				--active: #30343a;
				--line: #30343a;
				--text: #f0f1f3;
				--text-soft: #c6cad1;
				--muted: #8c929c;
				--accent: #b29af4;
				--accent-soft: #30294b;
				--shadow: 0 24px 60px rgb(0 0 0 / 32%), 0 2px 10px rgb(0 0 0 / 22%);
			}

			* {
				box-sizing: border-box;
			}

			html,
			body {
				margin: 0;
				min-height: 100%;
				overflow-x: hidden;
				background: var(--page);
				color: var(--text);
				font-family:
					Inter,
					ui-sans-serif,
					system-ui,
					-apple-system,
					BlinkMacSystemFont,
					'Segoe UI',
					sans-serif;
				font-size: 14px;
				letter-spacing: 0;
			}

			button,
			a {
				font: inherit;
				color: inherit;
			}

			button {
				border: 0;
				background: transparent;
			}

			button,
			a {
				-webkit-tap-highlight-color: transparent;
			}

			button:focus-visible,
			a:focus-visible {
				outline: 2px solid var(--accent);
				outline-offset: 2px;
			}

			.app-shell {
				display: flex;
				width: 100%;
				min-height: 100vh;
				padding: 18px;
				gap: 18px;
			}

			.sidebar {
				position: relative;
				display: flex;
				flex: 0 0 264px;
				flex-direction: column;
				min-width: 0;
				min-height: calc(100vh - 36px);
				padding: 10px 8px;
				border: 1px solid var(--line);
				border-radius: 13px;
				background: var(--sidebar);
				box-shadow: var(--shadow);
				transition:
					flex-basis 220ms ease,
					padding 220ms ease;
			}

			.sidebar-header {
				display: flex;
				align-items: center;
				justify-content: space-between;
				gap: 8px;
				min-height: 36px;
				padding: 0 2px 9px 4px;
				border-bottom: 1px solid var(--line);
			}

			.brand {
				display: flex;
				align-items: center;
				gap: 9px;
				min-width: 0;
				font-size: 15px;
				font-weight: 650;
				letter-spacing: 0;
			}

			.brand-mark {
				display: grid;
				width: 23px;
				height: 23px;
				place-items: center;
				border-radius: 7px;
				background: var(--accent);
				color: #ffffff;
				font-size: 13px;
				font-weight: 750;
			}

			.header-actions {
				display: flex;
				align-items: center;
				gap: 2px;
			}

			.icon-button {
				display: grid;
				width: 30px;
				height: 30px;
				place-items: center;
				border-radius: 8px;
				color: var(--muted);
				cursor: pointer;
				transition:
					background 160ms ease,
					color 160ms ease,
					transform 160ms ease;
			}

			.icon-button:hover {
				background: var(--hover);
				color: var(--text);
				transform: translateY(-1px);
			}

			.icon-button svg {
				width: 16px;
				height: 16px;
				stroke-width: 1.7;
			}

			.nav-list {
				display: flex;
				flex-direction: column;
				gap: 3px;
				min-width: 0;
				padding-top: 15px;
			}

			.nav-item {
				display: flex;
				align-items: center;
				gap: 10px;
				min-height: 39px;
				min-width: 0;
				padding: 5px 9px;
				border-radius: 10px;
				text-decoration: none;
				color: var(--text-soft);
				cursor: pointer;
				transition:
					background 160ms ease,
					color 160ms ease;
			}

			.nav-item:hover,
			.nav-item:focus-visible {
				background: var(--hover);
				color: var(--text);
			}

			.nav-item.is-active {
				background: var(--active);
				color: var(--text);
			}

			.icon-shell {
				display: grid;
				width: 24px;
				height: 24px;
				flex: 0 0 24px;
				place-items: center;
				border-radius: 7px;
				color: currentColor;
				transform-origin: center;
			}

			.icon-shell svg {
				width: 17px;
				height: 17px;
				fill: none;
				stroke: currentColor;
				stroke-width: 1.7;
				stroke-linecap: round;
				stroke-linejoin: round;
				overflow: visible;
			}

			.nav-label {
				flex: 1;
				min-width: 0;
				font-size: 13px;
				line-height: 1.35;
			}

			.nav-label small {
				display: block;
				margin-top: 1px;
				color: var(--muted);
				font-size: 11px;
			}

			.sidebar-footer {
				margin-top: auto;
				padding: 12px 9px 3px;
				border-top: 1px solid var(--line);
				color: var(--muted);
				font-size: 11px;
				line-height: 1.45;
			}

			.sidebar-footer strong {
				display: block;
				margin-bottom: 2px;
				color: var(--text-soft);
				font-size: 12px;
				font-weight: 600;
			}

			.canvas {
				display: flex;
				flex: 1;
				align-items: center;
				justify-content: center;
				min-width: 0;
				width: 100%;
				min-height: calc(100vh - 36px);
				padding: 30px;
				border: 1px solid var(--line);
				border-radius: 13px;
				background: var(--surface);
				box-shadow: var(--shadow);
			}

			.canvas-content {
				width: 100%;
				max-width: 620px;
				min-width: 0;
				text-align: center;
			}

			.canvas-kicker {
				margin: 0 0 9px;
				color: var(--accent);
				font-size: 12px;
				font-weight: 700;
				letter-spacing: 0.08em;
				text-transform: uppercase;
			}

			.canvas h1 {
				margin: 0;
				font-size: clamp(24px, 4vw, 38px);
				font-weight: 650;
				letter-spacing: 0;
			}

			.canvas p {
				margin: 13px auto 0;
				max-width: 470px;
				color: var(--text-soft);
				line-height: 1.7;
			}

			.motion-summary {
				display: grid;
				grid-template-columns: repeat(4, minmax(0, 1fr));
				gap: 8px;
				margin-top: 30px;
				text-align: left;
			}

			.motion-summary-item {
				padding: 11px 12px;
				border: 1px solid var(--line);
				border-radius: 9px;
				background: var(--surface-soft);
			}

			.motion-summary-item b {
				display: block;
				margin-bottom: 4px;
				font-size: 12px;
				font-weight: 650;
			}

			.motion-summary-item span {
				color: var(--muted);
				font-size: 11px;
				line-height: 1.45;
			}

			/* The four requested hover motions. Each runs once when the pointer enters. */
			.nav-item:is(:hover, :focus-visible) .icon-shell {
				animation: icon-breathe 900ms cubic-bezier(0.22, 0.8, 0.32, 1);
			}

			.motion-pencil:is(:hover, :focus-visible) svg {
				animation: pencil-wiggle 900ms cubic-bezier(0.34, 1.56, 0.64, 1);
				transform-origin: 31% 72%;
			}

			.motion-package-check:is(:hover, :focus-visible) svg .lucide-check-mark {
				animation: check-draw 950ms cubic-bezier(0.22, 0.8, 0.32, 1);
			}

			.motion-orbit:is(:hover, :focus-visible) svg .orbit-motion {
				animation: orbit-spin 1150ms cubic-bezier(0.2, 0.78, 0.28, 1);
				transform-box: view-box;
				transform-origin: 50% 50%;
			}

			.motion-blocks:is(:hover, :focus-visible) svg .blocks-corner {
				animation: corner-spin 1000ms cubic-bezier(0.22, 0.8, 0.32, 1);
				transform-box: fill-box;
				transform-origin: center;
			}

			@keyframes icon-breathe {
				0%,
				100% {
					transform: scale(1);
				}
				32% {
					transform: scale(1.14);
				}
				62% {
					transform: scale(0.95);
				}
			}

			@keyframes pencil-wiggle {
				0%,
				100% {
					transform: rotate(0deg);
				}
				32% {
					transform: rotate(-9deg);
				}
				66% {
					transform: rotate(7deg);
				}
			}

			@keyframes check-draw {
				0% {
					stroke-dashoffset: 1;
				}
				44% {
					stroke-dashoffset: 0;
				}
				100% {
					stroke-dashoffset: 0;
				}
			}

			@keyframes orbit-spin {
				from {
					transform: rotate(0deg);
				}
				to {
					transform: rotate(360deg);
				}
			}

			@keyframes corner-spin {
				from {
					transform: rotate(0deg);
				}
				to {
					transform: rotate(360deg);
				}
			}

			@media (prefers-reduced-motion: reduce) {
				*,
				*::before,
				*::after {
					animation-duration: 0.01ms !important;
					animation-iteration-count: 1 !important;
					transition-duration: 0.01ms !important;
				}
			}

			@media (max-width: 760px) {
				.app-shell {
					padding: 10px;
					gap: 10px;
				}

				.sidebar {
					flex-basis: 220px;
					min-height: calc(100vh - 20px);
				}

				.canvas {
					min-height: calc(100vh - 20px);
					padding: 20px 14px;
				}

				.motion-summary {
					grid-template-columns: repeat(2, minmax(0, 1fr));
				}
			}

			@media (max-width: 540px) {
				.app-shell {
					flex-direction: column;
					padding: 0;
				}

				.sidebar {
					flex: 0 0 auto;
					width: 100%;
					min-height: auto;
					border-top: 0;
					border-left: 0;
					border-right: 0;
					border-radius: 0;
				}

				.nav-list {
					grid-template-columns: repeat(2, minmax(0, 1fr));
					display: grid;
				}

				.sidebar-footer {
					display: none;
				}

				.nav-label small {
					display: none;
				}

				.canvas {
					width: 100%;
					flex: 1 1 auto;
					min-height: 70vh;
					border-right: 0;
					border-radius: 0;
				}
			}

			body.is-collapsed .sidebar {
				flex-basis: 58px;
				padding-inline: 7px;
			}

			body.is-collapsed .brand-name,
			body.is-collapsed .nav-label,
			body.is-collapsed .sidebar-footer {
				display: none;
			}

			body.is-collapsed .sidebar-header {
				justify-content: center;
				padding-inline: 0;
			}

			body.is-collapsed .header-actions {
				flex-direction: column;
			}

			body.is-collapsed .nav-item {
				justify-content: center;
				padding-inline: 4px;
			}
		</style>
	</head>
	<body>
		<div class="app-shell">
			<aside class="sidebar" aria-label="ArtiChat 侧边栏">
				<header class="sidebar-header">
					<div class="brand" aria-label="ArtiChat">
						<span class="brand-mark" aria-hidden="true">A</span>
						<span class="brand-name">ArtiChat</span>
					</div>
					<div class="header-actions">
						<button class="icon-button" type="button" title="搜索" aria-label="搜索">
							<i data-lucide="search"></i>
						</button>
						<button
							id="collapse-button"
							class="icon-button"
							type="button"
							title="收起侧边栏"
							aria-label="收起侧边栏"
						>
							<i data-lucide="panel-left-close"></i>
						</button>
					</div>
				</header>

				<nav class="nav-list" aria-label="主要导航">
					<a class="nav-item motion-pencil" href="#new-chat" data-motion="pencil">
						<span class="icon-shell"><i data-lucide="pencil"></i></span>
						<span class="nav-label">新对话<small>pencil · 左右轻摆</small></span>
					</a>
					<a class="nav-item motion-package-check" href="#assets" data-motion="package-check">
						<span class="icon-shell"><i data-lucide="package-check"></i></span>
						<span class="nav-label">资产中心<small>package-check · 对勾描边</small></span>
					</a>
					<a class="nav-item motion-orbit" href="#workspace" data-motion="orbit">
						<span class="icon-shell"><i data-lucide="orbit"></i></span>
						<span class="nav-label">工作空间<small>orbit · 弧线与圆点顺时针</small></span>
					</a>
					<a class="nav-item motion-blocks is-active" href="#marketplace" data-motion="blocks">
						<span class="icon-shell"><i data-lucide="blocks"></i></span>
						<span class="nav-label">模型广场<small>blocks · 右上方块旋转</small></span>
					</a>
				</nav>

				<footer class="sidebar-footer">
					<strong>悬停左侧四个入口</strong>
					每个动作只播放一遍，重新移入即可再次查看。
				</footer>
			</aside>

			<main class="canvas">
				<div class="canvas-content">
					<p class="canvas-kicker">ArtiChat 0.3.1 · Sidebar Motion</p>
					<h1>左侧图标动画预览</h1>
					<p>这是一页独立视觉 Demo。先确认四个图标和悬停动作，再把确认后的方案接入实际侧栏。</p>
					<div class="motion-summary" aria-label="图标动画概要">
						<div class="motion-summary-item"><b>新对话</b><span>铅笔左右轻摆</span></div>
						<div class="motion-summary-item"><b>资产中心</b><span>对勾快速描边</span></div>
						<div class="motion-summary-item"><b>工作空间</b><span>弧线和圆点转一圈</span></div>
						<div class="motion-summary-item"><b>模型广场</b><span>右上方块转一圈</span></div>
					</div>
				</div>
			</main>
		</div>

		<script>
			(() => {
				const lucide = window.lucide;
				if (!lucide) return;

				lucide.createIcons({
					attrs: {
						'stroke-width': 1.7,
						'aria-hidden': 'true'
					}
				});

				const namespace = 'http://www.w3.org/2000/svg';
				const orbitSvg = document.querySelector('.motion-orbit svg');
				if (orbitSvg) {
					const orbitElements = [...orbitSvg.querySelectorAll('path, circle')];
					const group = document.createElementNS(namespace, 'g');
					group.classList.add('orbit-motion');
					orbitSvg.insertBefore(group, orbitSvg.firstChild);
					orbitElements.forEach((element) => group.appendChild(element));
				}

				const checkPath = [...document.querySelectorAll('.motion-package-check svg path')].find(
					(path) => {
						const data = path.getAttribute('d') ?? '';
						return data.startsWith('m16 1') && data.includes('2 2 4-4');
					}
				);
				if (checkPath) {
					checkPath.classList.add('lucide-check-mark');
					checkPath.setAttribute('pathLength', '1');
					checkPath.style.strokeDasharray = '1';
					checkPath.style.strokeDashoffset = '0';
				}

				const corner = document.querySelector('.motion-blocks svg rect');
				corner?.classList.add('blocks-corner');

				document.querySelector('#collapse-button')?.addEventListener('click', () => {
					document.body.classList.toggle('is-collapsed');
					const collapsed = document.body.classList.contains('is-collapsed');
					const button = document.querySelector('#collapse-button');
					button?.setAttribute('aria-label', collapsed ? '展开侧边栏' : '收起侧边栏');
					button?.setAttribute('title', collapsed ? '展开侧边栏' : '收起侧边栏');
				});

				document
					.querySelector('[data-lucide="search"]')
					?.closest('button')
					?.addEventListener('click', (event) => {
						e.preventDefault();
					});
			})();
		</script>
	</body>
</html>
